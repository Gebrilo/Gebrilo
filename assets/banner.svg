<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="240" viewBox="0 0 900 240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" class="bg-start"/>
      <stop offset="100%" class="bg-end"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" class="accent-start"/>
      <stop offset="50%" class="accent-mid"/>
      <stop offset="100%" class="accent-end"/>
    </linearGradient>
  </defs>
  <style>
    .bg-start { stop-color: #0d1117; }
    .bg-end { stop-color: #161b22; }
    .accent-start { stop-color: #58a6ff; }
    .accent-mid { stop-color: #3fb950; }
    .accent-end { stop-color: #58a6ff; }
    .text-primary { fill: #f0f6fc; }
    .text-secondary { fill: #8b949e; }
    .text-accent { fill: #58a6ff; }
    .text-green { fill: #3fb950; }
    .rule { stroke: #30363d; stroke-width: 1; }
    .grid-line { stroke: #21262d; stroke-width: 0.5; }
    @media (prefers-color-scheme: light) {
      .bg-start { stop-color: #ffffff; }
      .bg-end { stop-color: #f6f8fa; }
      .text-primary { fill: #24292f; }
      .text-secondary { fill: #656d76; }
      .text-accent { fill: #0969da; }
      .text-green { fill: #1a7f37; }
      .rule { stroke: #d0d7de; }
      .grid-line { stroke: #eaeef2; }
    }
  </style>

  <!-- Background grid pattern -->
  <line x1="0" y1="40" x2="900" y2="40" class="grid-line"/>
  <line x1="0" y1="80" x2="900" y2="80" class="grid-line"/>
  <line x1="0" y1="120" x2="900" y2="120" class="grid-line"/>
  <line x1="0" y1="160" x2="900" y2="160" class="grid-line"/>
  <line x1="0" y1="200" x2="900" y2="200" class="grid-line"/>

  <!-- Terminal-style indicators -->
  <circle cx="30" cy="30" r="5" fill="#f85149" opacity="0.8"/>
  <circle cx="48" cy="30" r="5" fill="#f0883e" opacity="0.8"/>
  <circle cx="66" cy="30" r="5" fill="#3fb950" opacity="0.8"/>
  <text x="82" y="35" font-family="monospace" font-size="11" class="text-secondary">~/profile/readme</text>

  <!-- Name -->
  <text x="450" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" class="text-primary" letter-spacing="-0.5">Abdelrahman Gebril</text>

  <!-- Role -->
  <text x="450" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" class="text-secondary" letter-spacing="1.5">SENIOR SOFTWARE QUALITY CONTROL ENGINEER</text>

  <!-- Tagline -->
  <text x="450" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" class="text-accent">
    I engineer <tspan class="text-green" font-weight="700">confidence</tspan> into software.
  </text>

  <!-- Bottom rule -->
  <line x1="200" y1="200" x2="700" y2="200" class="rule"/>
</svg>